name: Build and test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gameplay:
    name: Shared gameplay (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and exercise the complete slice
        run: make test
      - name: Check memory and undefined behavior
        run: make sanitize

  n64:
    name: Native MIPS compilation (no ROM)
    # Match Dockerfile's release and its available MIPS cross-toolchain packages.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mips-linux-gnu binutils-mips-linux-gnu
      - name: Compile real native objects and boot hooks
        run: python3 tools/check_native.py --require-mips
      - name: Compile PlayState total-conversion integration
        run: python3 tools/check_native.py --require-mips --oot-conversion --engine build/engine-oot
      - name: Generate original Stadium fixture and compile native rendered asset
        run: |
          python3 -c 'import sys; from pathlib import Path; sys.path[:0] = ["tools", "tests"]; from test_stadium_rig import animated_model; from stadium_n64 import emit_source; model = animated_model(); second = dict(model["primitives"][0]); second["texture"] = 65535; model["primitives"].append(second); target = Path("assets/private/stadium/001/stadium_bulbasaur_n64.c"); target.parent.mkdir(parents=True, exist_ok=True); target.write_text(emit_source(model)[0])'
          python3 tools/check_native.py --require-mips --oot-conversion --engine build/engine-oot-fixture
      - name: Check overlay and ROM input safeguards
        run: python3 tests/test_tools.py

  n64-docker:
    name: Docker toolchain (${{ matrix.arch }}, no ROM)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image, host tools and six native objects
        run: make check-native-docker
      - name: Check the native OoT PlayState conversion
        run: make check-native-oot-docker
